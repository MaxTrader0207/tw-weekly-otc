name: 抓取上櫃資料
on:
  schedule:
    - cron: '30 9 * * 1-5'    # 台灣時間 17:30（週一～週五）
    - cron: '30 10 * * 1-5'   # 台灣時間 18:30（備援；GitHub 排程偶爾會延遲）
    - cron: '30 13 * * 1-5'   # 台灣時間 21:30（補抓當天較晚公布的資料）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: otc-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取櫃買中心資料
        run: node scripts/fetch_otc.mjs
      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cache
          if git diff --cached --quiet; then echo "資料沒有變化"; else git commit -m "上櫃資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" && git push; fi
